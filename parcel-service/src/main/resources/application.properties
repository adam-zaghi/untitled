spring.application.name=parcel-service
server.port=8083
spring.datasource.url=jdbc:postgresql://localhost:5432/parcel_db

spring.cloud.config.enabled=false
spring.datasource.username=smartlog
spring.datasource.password=smartlog123
spring.datasource.driver-class-name=org.postgresql.Driver
management.endpoints.web.exposure.include=*

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.data.rest.base-path=/api

#discovery
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

#kafka
spring.kafka.bootstrap-servers=localhost:9092

#groupe id du consumer+ si il lit pour la premiere fois il fait des le debut
spring.kafka.consumer.group-id=parcel-service
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer