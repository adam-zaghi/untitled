services:
  postgres:
    image: postgres:16
    container_name: smartlog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartlog
      POSTGRES_PASSWORD: smartlog123
      POSTGRES_DB: smartlog_main
    ports:
      - "5432:5432"
    volumes:
      - smartlog_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

volumes:
  smartlog_postgres_data: